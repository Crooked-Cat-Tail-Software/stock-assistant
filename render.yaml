# Render Blueprint: infrastructure as code for the production deployment.
# Create it once in the Render dashboard (New → Blueprint → this repo); see
# docs/deployment.md. Render deploys a commit on main only after every GitHub
# check on it has passed (autoDeployTrigger: checksPass); a separate workflow
# then verifies the live site.
#
# Values marked `sync: false` are secrets: Render asks for them when the
# Blueprint is first created and they are never stored in this file.
#
# ONE service: nginx and the API run in one container (root Dockerfile). With
# two free services, a sleeping API couldn't be woken by the web service and
# the site broke after 15 idle minutes (issue #24). The former
# stock-assistant-api service is no longer part of this Blueprint.

services:
  - type: web
    name: stock-assistant-web
    runtime: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon            # keep the Neon database in the same area (AWS us-west-2)
    healthCheckPath: /api/health   # through nginx to the API: checks both
    autoDeployTrigger: checksPass  # deploy only after all CI checks pass
    envVars:
      - key: PORT             # nginx listens on 8080
        value: "8080"
      # nginx → API inside the container. Must be set explicitly: this service
      # previously pointed at the separate API's public URL, and a service
      # setting overrides the image default.
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: DATABASE_URL     # Neon connection string (free tier, doesn't expire)
        sync: false
      - key: AGENT_MODE       # "openai" for real answers, "fake" to run without cost
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ALPHAVANTAGE_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      # Optional now: nginx and the API read the same value in one container.
      - key: INTERNAL_API_TOKEN
        sync: false
      # Client IP for the rate limit: Render delivers requests via Cloudflare
      # and a local proxy (127.0.0.1). Trust only that proxy, and only
      # Cloudflare's CF-Connecting-IP, which clients can't forge. Verified on
      # Render 2026-10-20; see docs/deployment.md.
      - key: TRUSTED_PROXY_CIDR
        value: 127.0.0.1/32
      - key: REAL_IP_HEADER
        value: CF-Connecting-IP
