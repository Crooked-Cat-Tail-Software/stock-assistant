name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Read-only token by default: CI never needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a run on main mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate openapi.yaml
        run: uvx openapi-spec-validator openapi.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Frontend types are up to date with the contract
        working-directory: frontend
        run: |
          npm run gen:api
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is stale. Run 'npm run gen:api' in frontend/ and commit it."
            exit 1
          }

  backend:
    name: Backend (lint, unit, integration on Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=term
      - name: Integration tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://app:app@localhost:5432/app_test
        run: uv run pytest tests/integration --cov --cov-append --cov-report=term

  frontend:
    name: Frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker Compose (build and smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build
      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through nginx
        run: |
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"database":"ok"'
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy"
          id=$(curl -fsS -X POST http://localhost:8080/api/sessions | jq -r .id)
          curl -fsS -X POST "http://localhost:8080/api/sessions/$id/messages" \
            -H 'content-type: application/json' -d '{"content":"What is AAPL?"}' \
            | jq -e '.assistant_message.tool_calls[0].name == "GLOBAL_QUOTE"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render
    # Only after every check above passes, only for pushes to main, and only
    # once deployment is configured (repository variable DEPLOY_ENABLED=true).
    needs: [contract, backend, frontend, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      BACKEND_URL: ${{ vars.BACKEND_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail fast with a clear message if a secret was pasted incompletely.
      # Never prints the values (they contain Render's deploy key).
      - name: Check deploy configuration
        env:
          HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
          HOOK_FRONTEND: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: |
          ok=true
          for name in HOOK_BACKEND HOOK_FRONTEND; do
            value=${!name}
            if [[ ! $value =~ ^https://api\.render\.com/deploy/srv-[A-Za-z0-9]+\?key=[A-Za-z0-9_-]+$ ]]; then
              echo "::error::RENDER_DEPLOY_${name} is not a Render deploy hook URL (expected https://api.render.com/deploy/srv-...?key=..., got ${#value} characters). Copy it again from the service's Settings → Deploy Hook."
              # Yes/no facts only: enough to diagnose a bad paste, never the value itself.
              # (case patterns, so nothing here can stop the script under bash -e)
              # shellcheck disable=SC2254  # $1 is meant to be a glob pattern
              has() { case $value in $1) echo yes ;; *) echo no ;; esac; }
              echo "  starts with https://:        $(has 'https://*')"
              echo "  contains api.render.com:     $(has '*api.render.com*')"
              echo "  contains /deploy/srv-:       $(has '*/deploy/srv-*')"
              echo "  contains ?key=:              $(has '*[?]key=*')"
              echo "  contains spaces/line breaks: $(has '*[[:space:]]*')"
              case $value in *[!0-9a-f]* | "") hex=no ;; *) hex=yes ;; esac
              echo "  only 0-9 and a-f (like the openssl token): $hex"
              ok=false
            fi
          done
          for name in BACKEND_URL FRONTEND_URL; do
            [[ ${!name} =~ ^https://[a-z0-9-]+\.onrender\.com$ ]] || { echo "::error::Repository variable $name is missing or not an onrender.com URL"; ok=false; }
          done
          $ok

      # Backend first: it runs the database migrations the new frontend may rely on.
      - name: Trigger backend deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: curl -fsS -X POST "$HOOK" -o /dev/null
      - name: Wait until the backend runs this commit
        run: ops/scripts/wait-for-commit.sh "$BACKEND_URL/api/health" "$GITHUB_SHA"

      - name: Trigger frontend deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_FRONTEND }}
        run: curl -fsS -X POST "$HOOK" -o /dev/null
      - name: Wait until the frontend runs this commit
        run: ops/scripts/wait-for-commit.sh "$FRONTEND_URL/version" "$GITHUB_SHA"

      - name: Smoke test production
        run: |
          # The app works through the frontend (nginx adds the internal token)...
          curl -fsS "$FRONTEND_URL/api/health" | jq -e '.status == "ok" and .database == "ok"'
          curl -fsS "$FRONTEND_URL/api/sessions" -o /dev/null
          curl -fsSI "$FRONTEND_URL/" | grep -qi "content-security-policy"
          # ...and the backend refuses requests that bypass it.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/sessions")
          if [ "$code" != "403" ]; then
            echo "::error::Backend answered $code to a direct request; expected 403"
            exit 1
          fi

